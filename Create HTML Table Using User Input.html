<!DOCTYPE html> 
<html> 
<body> 
 
<h2>Create HTML Table</h2> 
 
Rows: <input type="number" id="rows"><br><br> 
Columns: <input type="number" id="cols"><br><br> 
 
<button onclick="createTable()">Create Table</button> 
 
<div id="tableDiv"></div> 
 
<script> 
function createTable() { 
    let r = document.getElementById("rows").value; 
    let c = document.getElementById("cols").value; 
 
    let html = "<table border='1' cellpadding='5'>"; 
 
    for (let i = 0; i < r; i++) { 
        html += "<tr>"; 
        for (let j = 0; j < c; j++) { 
            html += `<td>Row ${i+1}, Col ${j+1}</td>`; 
        } 
        html += "</tr>"; 
    } 
    html += "</table>"; 
 
    document.getElementById("tableDiv").innerHTML = html; 
} 
</script> 
 
</body>
