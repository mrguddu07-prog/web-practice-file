<!DOCTYPE html>
<html>
<head>
    <title>Largest of Three Numbers</title>
</head>
<body>
    <h2>Largest of Three Numbers</h2>

    <script>
        let a = 25;
        let b = 40;
        let c = 30;

        if (a >= b && a >= c) {
            document.write("Largest number is: " + a);
        } else if (b >= a && b >= c) {
            document.write("Largest number is: " + b);
        } else {
            document.write("Largest number is: " + c);
        }
    </script>
</body>
</html>
