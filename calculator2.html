<!DOCTYPE html> 
<html> 
<body> 
<h2>Simple JavaScript Calculator</h2> 
Number 1: <input type="number" id="num1"><br><br> 
Number 2: <input type="number" id="num2"><br><br> 
<button onclick="calc('+')">Add</button> 
<button onclick="calc('-')">Subtract</button> 
<button onclick="calc('*')">Multiply</button> 
<button onclick="calc('/')">Divide</button> 
<h3>Result: <span id="result"></span></h3> 
<script> 
function calc(op){ 
let a = parseFloat(document.getElementById("num1").value); 
let b = parseFloat(document.getElementById("num2").value); 
let res; 
if(op=='+') res = a+b; 
else if(op=='-') res = a-b; 
else if(op=='*') res = a*b; 
else if(op=='/') res = a/b; 
document.getElementById("result").innerText = res; 
} 
</script> 
</body> 
</html>
