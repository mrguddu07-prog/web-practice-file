<!DOCTYPE html>
<html>
<body>
<h2> Javascript classes example</h2>
<script>

 class student{
  constructor(name,age){
     this.name=name;
	 this.age=age;
	 }
	}
	 let s1 = new student("rahul",20);
	 
	 document.write("name:"+s1.name+"<br>");
	 document.write("age:"+s1.age);
	 
</script>
</body>
</html>
