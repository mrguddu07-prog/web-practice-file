<!DOCTYPE html> 
<html> 
<body> 
 
<h2>Squares and Cubes (0 - 10)</h2> 
<button onclick="generateTable()">Generate Table</button> 
 
<div id="output"></div> 
 
<script> 
function generateTable() { 
    let html = "<table border='1' 
cellpadding='5'><tr><th>Number</th><th>Square</th><th>Cube</th></tr>"; 
 
    for (let i = 0; i <= 10; i++) { 
        html += `<tr> 
                   <td>${i}</td> 
                   <td>${i*i}</td> 
                   <td>${i*i*i}</td> 
                 </tr>`; 
    } 
 
    html += "</table>"; 
    document.getElementById("output").innerHTML = html; 
} 
</script> 
 
</body> 
</html>
